    "beautifulsoup4>=4.12.0,<5",
    "curl-cffi>=0.13.0",
    "fastapi>=0.115.0",
    "google-generativeai>=0.8.0",
    "jsonschema>=4.20.0,<5",
    "neo4j>=5.0.0",
    "openai>=1.50.0",
    "pypdf2>=3.0.0,<4",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0,<3",
    "selenium>=4.0.0,<5",
    "trafilatura>=1.6.0,<2",
    "typing-extensions>=4.0.0,<5",
    "uvicorn[standard]>=0.32.0",
    "webdriver-manager>=4.0.0,<5",
