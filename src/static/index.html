<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSINT Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f14;
      --bg2:       #12151c;
      --bg3:       #181c26;
      --border:    #252a38;
      --accent:    #3b82f6;
      --accent2:   #6366f1;
      --success:   #22c55e;
      --warn:      #f59e0b;
      --text:      #e2e8f0;
      --text-dim:  #64748b;
      --text-mid:  #94a3b8;
      --radius:    12px;
      --sidebar-w: 260px;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
    }

    /* ── Sidebar ─────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 20px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    #sidebar-header h1 {
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    #sidebar-header p { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

    #new-thread-btn {
      margin: 12px 16px;
      padding: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: calc(100% - 32px);
      transition: opacity .2s, transform .15s;
    }
    #new-thread-btn:hover { opacity: .88; transform: translateY(-1px); }
    #new-thread-btn:active { transform: translateY(0); }

    #thread-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
    }

    .thread-item {
      padding: 10px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-mid);
      margin-bottom: 2px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background .15s;
      gap: 6px;
    }
    .thread-item:hover { background: var(--bg3); }
    .thread-item.active { background: rgba(59,130,246,.15); color: var(--text); }

    .thread-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thread-del {
      opacity: 0;
      font-size: 14px;
      color: var(--text-dim);
      cursor: pointer;
      transition: opacity .15s, color .15s;
      padding: 2px 4px;
      border-radius: 4px;
      line-height: 1;
    }
    .thread-item:hover .thread-del { opacity: 1; }
    .thread-del:hover { color: #ef4444; }

    /* ── Main area ───────────────────────────────── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #thread-label {
      font-size: 12px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }

    #model-badge {
      margin-left: auto;
      font-size: 11px;
      padding: 3px 8px;
      background: rgba(99,102,241,.15);
      border: 1px solid rgba(99,102,241,.3);
      border-radius: 20px;
      color: var(--accent2);
    }

    /* ── Messages ────────────────────────────────── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .msg {
      display: flex;
      gap: 10px;
      max-width: 820px;
      width: 100%;
      animation: fadeUp .25s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.assistant { align-self: flex-start; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .msg.user .avatar    { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .msg.assistant .avatar { background: var(--bg3); border: 1px solid var(--border); }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.65;
      max-width: 680px;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: linear-gradient(135deg, rgba(59,130,246,.25), rgba(99,102,241,.25));
      border: 1px solid rgba(99,102,241,.35);
      border-bottom-right-radius: 4px;
    }
    .msg.assistant .bubble {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    /* ── Tool call events ────────────────────────── */
    .tool-event {
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      align-self: flex-start;
      max-width: 820px;
    }

    .tool-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      user-select: none;
    }
    .tool-header:hover { background: var(--border); }

    .tool-icon { color: var(--warn); }
    .tool-name { color: var(--text); font-weight: 500; }
    .tool-chevron { margin-left: auto; color: var(--text-dim); transition: transform .2s; }
    .tool-header.open .tool-chevron { transform: rotate(180deg); }

    .tool-body {
      display: none;
      background: var(--bg);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 8px 8px;
      padding: 10px;
      color: var(--text-mid);
      white-space: pre-wrap;
      overflow-x: auto;
      font-size: 11px;
    }
    .tool-body.open { display: block; }

    /* ── Typing indicator ───────────────────────── */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 14px 16px;
      align-items: center;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .4; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    /* ── Input area ──────────────────────────────── */
    #input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg2);
    }

    #input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      transition: border-color .2s;
    }
    #input-row:focus-within { border-color: var(--accent); }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      resize: none;
      max-height: 160px;
      line-height: 1.5;
    }
    #user-input::placeholder { color: var(--text-dim); }

    #send-btn {
      width: 36px; height: 36px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .2s, transform .15s;
      flex-shrink: 0;
    }
    #send-btn:hover:not(:disabled) { opacity: .85; transform: scale(1.05); }
    #send-btn:disabled { opacity: .35; cursor: not-allowed; }

    #send-btn svg { width: 16px; height: 16px; }

    #hint { font-size: 11px; color: var(--text-dim); margin-top: 6px; text-align: center; }

    /* ── Scrollbar ───────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Empty state ─────────────────────────────── */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-dim);
    }
    #empty-state .big-icon { font-size: 48px; }
    #empty-state h2 { font-size: 20px; font-weight: 600; color: var(--text-mid); }
    #empty-state p  { font-size: 13px; }
  </style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <div id="sidebar-header">
    <h1>🕵️ OSINT Agent</h1>
    <p>Intelligence at your command</p>
  </div>
  <button id="new-thread-btn">+ New Investigation</button>
  <div id="thread-list"></div>
</div>

<!-- Main -->
<div id="main">
  <div id="chat-header">
    <span id="thread-label">No thread selected</span>
    <span id="model-badge">Custom Agent v2</span>
  </div>

  <div id="messages">
    <div id="empty-state">
      <div class="big-icon">🔍</div>
      <h2>Start an investigation</h2>
      <p>Ask about a person, domain, or entity to begin.</p>
    </div>
  </div>

  <div id="input-area">
    <div id="input-row">
      <textarea id="user-input" rows="1" placeholder="Ask the OSINT agent…"></textarea>
      <button id="send-btn" title="Send (Enter)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div id="hint">Enter to send · Shift+Enter for newline</div>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let currentThreadId = null;

// ── DOM refs ─────────────────────────────────────────────────────────────────
const messagesEl     = document.getElementById('messages');
const userInputEl    = document.getElementById('user-input');
const sendBtn        = document.getElementById('send-btn');
const threadListEl   = document.getElementById('thread-list');
const threadLabelEl  = document.getElementById('thread-label');
const newThreadBtn   = document.getElementById('new-thread-btn');

// ── Thread management ─────────────────────────────────────────────────────────
async function loadThreadList() {
  try {
    const res  = await fetch('/api/threads');
    const list = await res.json();
    threadListEl.innerHTML = '';
    list.forEach(t => {
      const div = document.createElement('div');
      div.className = 'thread-item' + (t.thread_id === currentThreadId ? ' active' : '');
      div.dataset.id = t.thread_id;
      div.innerHTML = `
        <span class="thread-title">${escHtml(t.title || t.thread_id.slice(0,8))}</span>
        <span class="thread-del" title="Delete">✕</span>`;
      div.querySelector('.thread-title').onclick = () => switchThread(t.thread_id);
      div.querySelector('.thread-del').onclick = (e) => { e.stopPropagation(); deleteThread(t.thread_id); };
      threadListEl.appendChild(div);
    });
  } catch(e) { console.error('load threads', e); }
}

async function switchThread(id) {
  currentThreadId = id;
  threadLabelEl.textContent = 'thread: ' + id.slice(0, 12) + '…';
  messagesEl.innerHTML = '';
  try {
    const res  = await fetch(`/api/threads/${id}/messages`);
    const msgs = await res.json();
    msgs.forEach(m => {
      if (m.role === 'user') appendUserBubble(m.content);
      else if (m.role === 'assistant' && m.content) appendAssistantBubble(m.content);
    });
  } catch(e) { console.error('load messages', e); }
  loadThreadList();
}

async function deleteThread(id) {
  await fetch(`/api/threads/${id}`, { method: 'DELETE' });
  if (currentThreadId === id) {
    currentThreadId = null;
    messagesEl.innerHTML = emptyStateHtml();
    threadLabelEl.textContent = 'No thread selected';
  }
  loadThreadList();
}

newThreadBtn.onclick = () => {
  currentThreadId = null;
  messagesEl.innerHTML = emptyStateHtml();
  threadLabelEl.textContent = 'New investigation';
  document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
};

// ── Send message ──────────────────────────────────────────────────────────────
async function send() {
  const text = userInputEl.value.trim();
  if (!text) return;
  userInputEl.value = '';
  autoResize();

  // Remove empty state
  document.getElementById('empty-state')?.remove();

  appendUserBubble(text);
  const typingEl = appendTypingIndicator();

  sendBtn.disabled = true;

  // Create SSE request
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text, thread_id: currentThreadId }),
  });

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let assistantBubble = null;

  typingEl.remove();

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    const raw = decoder.decode(value, { stream: true });
    const lines = raw.split('\n');

    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      let payload;
      try { payload = JSON.parse(line.slice(6)); } catch { continue; }

      if (payload.type === 'thread_id') {
        currentThreadId = payload.thread_id;
        threadLabelEl.textContent = 'thread: ' + currentThreadId.slice(0,12) + '…';
        loadThreadList();
      }

      else if (payload.type === 'text') {
        if (!assistantBubble) assistantBubble = appendAssistantBubble('');
        const bubbleContent = assistantBubble.querySelector('.bubble');
        bubbleContent.textContent += payload.chunk;
        scrollToBottom();
      }

      else if (payload.type === 'tool_start') {
        assistantBubble = null; // reset so next text gets its own bubble
        appendToolEvent(payload.name, payload.args, null);
        scrollToBottom();
      }

      else if (payload.type === 'tool_end') {
        updateLastToolResult(payload.name, payload.result);
        scrollToBottom();
      }

      else if (payload.type === 'done') {
        loadThreadList();
      }

      else if (payload.type === 'error') {
        appendErrorBubble(payload.message);
        scrollToBottom();
      }
    }
  }

  sendBtn.disabled = false;
  userInputEl.focus();
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function appendUserBubble(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `
    <div class="avatar">👤</div>
    <div class="bubble">${escHtml(text)}</div>`;
  messagesEl.appendChild(div);
  scrollToBottom();
  return div;
}

function appendAssistantBubble(text) {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.innerHTML = `
    <div class="avatar">🤖</div>
    <div class="bubble">${escHtml(text)}</div>`;
  messagesEl.appendChild(div);
  scrollToBottom();
  return div;
}

let _lastToolEl = null;

function appendToolEvent(name, args, result) {
  const div = document.createElement('div');
  div.className = 'tool-event';
  const argsStr = typeof args === 'object' ? JSON.stringify(args, null, 2) : String(args);
  div.innerHTML = `
    <div class="tool-header">
      <span class="tool-icon">⚙</span>
      <span class="tool-name">${escHtml(name)}</span>
      <span class="tool-chevron">▾</span>
    </div>
    <div class="tool-body">
<b>Args:</b>\n${escHtml(argsStr)}</div>`;

  div.querySelector('.tool-header').onclick = function() {
    this.classList.toggle('open');
    div.querySelector('.tool-body').classList.toggle('open');
  };

  messagesEl.appendChild(div);
  _lastToolEl = div;
  return div;
}

function updateLastToolResult(name, result) {
  if (!_lastToolEl) return;
  const body = _lastToolEl.querySelector('.tool-body');
  if (body) {
    const existing = body.innerHTML;
    body.innerHTML = existing + `\n<b>Result:</b>\n${escHtml(result || '')}`;
  }
}

function appendErrorBubble(msg) {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.innerHTML = `
    <div class="avatar">⚠</div>
    <div class="bubble" style="border-color:#ef444455;color:#f87171">${escHtml(msg)}</div>`;
  messagesEl.appendChild(div);
}

function appendTypingIndicator() {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.innerHTML = `
    <div class="avatar">🤖</div>
    <div class="bubble typing-indicator">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>`;
  messagesEl.appendChild(div);
  scrollToBottom();
  return div;
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function emptyStateHtml() {
  return `<div id="empty-state">
    <div class="big-icon">🔍</div>
    <h2>Start an investigation</h2>
    <p>Ask about a person, domain, or entity to begin.</p>
  </div>`;
}

// ── Input auto-resize & keyboard ─────────────────────────────────────────────
function autoResize() {
  userInputEl.style.height = 'auto';
  userInputEl.style.height = Math.min(userInputEl.scrollHeight, 160) + 'px';
}

userInputEl.addEventListener('input', autoResize);
userInputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
sendBtn.onclick = send;

// ── Init ─────────────────────────────────────────────────────────────────────
loadThreadList();
</script>
</body>
</html>
